<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Urban Futsal</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=DM+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one narrow column, three large full-width tap rows plus a call row, built for a phone after a QR scan. */
:root {
  --bg: #eef1f5;
  --surface: #ffffff;
  --fg: #111827;
  --muted: #5b6676;
  --line: #d6dce5;
  --accent: #1d4ed8;
  --accent-fg: #ffffff;
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "DM Sans", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f141b; --surface: #19212c; --fg: #f1f4f8; --muted: #9aa6b6;
    --line: #2b3646; --accent: #7aa2ff; --accent-fg: #0f141b; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f141b; --surface: #19212c; --fg: #f1f4f8; --muted: #9aa6b6;
  --line: #2b3646; --accent: #7aa2ff; --accent-fg: #0f141b; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.5;
  padding-block: 40px 32px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  min-height: 100%;
}
main { max-width: 440px; margin: 0 auto; display: flex; flex-direction: column; gap: 28px; }
header { display: flex; flex-direction: column; gap: 10px; }
.mark {
  width: 56px; height: 56px; border-radius: 14px;
  background: var(--accent); color: var(--accent-fg);
  display: grid; place-items: center;
  font: 800 22px/1 var(--font-display); letter-spacing: -0.02em;
}
h1 {
  font: 800 clamp(32px, 9vw, 42px)/1.05 var(--font-display);
  letter-spacing: -0.02em; margin: 0; text-wrap: balance;
}
.lede { margin: 0; color: var(--muted); max-width: 34ch; }
ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; }
a.link {
  display: flex; align-items: center; gap: 16px;
  min-height: 84px; padding: 14px 18px;
  background: var(--surface); color: var(--fg);
  border: 1.5px solid var(--line); border-radius: 16px;
  text-decoration: none;
  transition: border-color .15s ease, transform .15s ease;
}
a.link:hover { border-color: var(--accent); }
a.link:active { transform: scale(.985); }
a.link:focus-visible, button:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
.glyph {
  flex: none; width: 48px; height: 48px; border-radius: 12px;
  display: grid; place-items: center;
  background: var(--bg); border: 1.5px solid var(--line);
  color: var(--accent);
}
.glyph svg { width: 26px; height: 26px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.text { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.name { font: 800 20px/1.2 var(--font-display); letter-spacing: -0.01em; }
.hint { color: var(--muted); font-size: 14px; overflow-wrap: anywhere; }
.go { flex: none; color: var(--accent); }
.go svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; display: block; }
.call {
  display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px;
  padding: 18px; border-radius: 16px;
  background: var(--accent); color: var(--accent-fg);
}
.call .label { flex: 1 1 160px; min-width: 0; display: flex; flex-direction: column; }
.call .label span:first-child { font-size: 14px; opacity: .85; }
.call .num { font: 800 26px/1.15 var(--font-display); letter-spacing: .01em; font-variant-numeric: tabular-nums; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }
.btn {
  font: 600 15px/1 var(--font-body);
  min-height: 44px; padding: 0 16px; border-radius: 12px;
  display: inline-flex; align-items: center; justify-content: center;
  border: 1.5px solid var(--accent-fg); cursor: pointer; text-decoration: none;
}
.btn.solid { background: var(--accent-fg); color: var(--accent); }
.btn.ghost { background: transparent; color: var(--accent-fg); }
.call :focus-visible { outline: 3px solid var(--accent-fg); outline-offset: 3px; }
@media (prefers-reduced-motion: reduce) { a.link { transition: none; } }
</style>

<main>
  <header>
    <div class="mark" aria-hidden="true">UF</div>
    <h1>Urban Futsal</h1>
    <p class="lede">Choisissez votre réseau et nous vous emmenons directement sur notre page.</p>
  </header>

  <ul>
    <li>
      <a class="link" href="https://www.facebook.com/share/1EsmQsjyZa/" target="_blank" rel="noopener">
        <span class="glyph" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M14 8h3V4h-3a4 4 0 0 0-4 4v3H7v4h3v6h4v-6h3l1-4h-4V8z"/></svg></span>
        <span class="text"><span class="name">Facebook</span><span class="hint">Actualités, offres et messages</span></span>
        <span class="go" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>
      </a>
    </li>
    <li>
      <a class="link" href="https://www.instagram.com/urbanfutsal1?exln=bDh5MzcybmptamQ=" target="_blank" rel="noopener">
        <span class="glyph" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="5"/><circle cx="12" cy="12" r="3.6"/><circle cx="16.8" cy="7.2" r=".6"/></svg></span>
        <span class="text"><span class="name">Instagram</span><span class="hint">Photos et stories</span></span>
        <span class="go" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>
      </a>
    </li>
    <li>
      <a class="link" href="https://www.tiktok.com/@urban.futsal?_r=1&amp;_t=ZS-9AiKKdGwMh2" target="_blank" rel="noopener">
        <span class="glyph" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M14 4v10.5a3.5 3.5 0 1 1-3.5-3.5"/><path d="M14 4c.4 2.6 2.1 4.2 5 4.4"/></svg></span>
        <span class="text"><span class="name">TikTok</span><span class="hint">Vidéos courtes</span></span>
        <span class="go" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>
      </a>
    </li>
  </ul>

  <section class="call" aria-label="Nous appeler">
    <div class="label"><span>Réservations et renseignements</span><span class="num" id="num">034 75 555 25</span></div>
    <div class="actions">
      <a class="btn solid" href="tel:0347555525">Appeler</a>
      <button class="btn ghost" id="copy" type="button">Copier</button>
    </div>
  </section>
</main>

<script>
(function () {
  var btn = document.getElementById("copy");
  var num = document.getElementById("num");
  btn.addEventListener("click", function () {
    function done() { btn.textContent = "Copié"; setTimeout(function () { btn.textContent = "Copier"; }, 1800); }
    function fallback() {
      var r = document.createRange(); r.selectNodeContents(num);
      var s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
    }
    try {
      navigator.clipboard.writeText(num.textContent).then(done, fallback);
    } catch (e) { fallback(); }
  });
})();
</script>

</body></html>
